apis:
- name: Nori Teleoperation SDK
  description: >-
    @nori/sdk — robot-local teleoperation SDK. Connects to a Nori robot over
    WebRTC, receives video and telemetry, and drives it from the browser via the
    RemoteTeleop client. Signaling over the reference Supabase transport or
    bring-your-own; NDJSON control at 50Hz to the robot daemon (nori-protocol
    v1). There is no cloud REST base URL — the SDK speaks WebRTC to a local robot
    daemon, so no baseURL is published.
  humanURL: https://docs.norirobotics.com/sdk/

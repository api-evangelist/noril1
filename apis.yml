aid: noril1
name: Nori
description: >-
  Nori (Nori Robotics) is a Y Combinator (Summer 2026) hard-tech company in San
  Francisco building affordable bimanual humanoid home robots — the NORI L2, a
  sub-$1,300 wheeled robot with dual Z-axis lift arms that autonomously handles
  household chores like loading dishes, making beds, food prep, and cleaning,
  with multiple units able to collaborate on coordinated tasks. Beyond the
  hardware, Nori publishes a developer surface: the @nori/sdk robot-local
  teleoperation SDK connects to a robot over WebRTC to stream video and
  telemetry and drive it from the browser in ~20 lines, with all safety
  mechanisms (clamping, watchdog, E-STOP, motor torque lifecycle) enforced on
  the robot's control daemon. The SDK targets the nori-protocol v1 wire format
  (NDJSON over a WebRTC data channel to the daemon on port 7777), is Apache-2.0
  licensed, and is distributed to a small set of collaborating developers as a
  tarball rather than on public npm.
